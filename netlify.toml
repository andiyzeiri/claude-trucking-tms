[build]
  base = "frontend"
  command = "npm run build-and-export"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  NEXT_PUBLIC_API_URL = "/api"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# Redirect API calls to your AWS backend via Application Load Balancer
[[redirects]]
  from = "/api/*"
  to = "http://trucking-tms-alb-1848896522.us-east-1.elb.amazonaws.com/api/:splat"
  status = 200
  force = true

# Redirect all other requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build-and-export"

[context.deploy-preview]
  command = "npm run build-and-export"

[context.branch-deploy]
  command = "npm run build-and-export"