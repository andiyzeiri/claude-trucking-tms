[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_API_URL = "/api"
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy API requests to backend with proper header forwarding
[[redirects]]
  from = "/api/*"
  to = "https://trucking-tms-alb-1848896522.us-east-1.elb.amazonaws.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "netlify"}
