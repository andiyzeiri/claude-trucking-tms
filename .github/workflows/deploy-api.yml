name: Deploy API to AWS ECS

# Builds the backend image and rolls it out to the RUNNING production service.
#
# Deliberately does NOT run Terraform. The previous version of this workflow
# ran `terraform init -backend=false && terraform plan && terraform apply
# -auto-approve` against ./infra, which - with no state backend - plans to
# create an entire parallel stack (VPC, RDS, ElastiCache, ALB, ECS) from
# scratch and then auto-approves it. It also targeted `andi-tms-prod-*`
# resources, while production actually runs on `trucking-tms-*`, so it would
# not have deployed the change either way.
#
# Infrastructure changes are made deliberately, not as a side effect of a
# code push. ./infra is currently out of sync with production and would need
# `terraform import` before it can safely manage these resources.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: trucking-tms-backend
  ECS_CLUSTER: trucking-tms-cluster
  ECS_SERVICE: trucking-tms-backend-service
  TASK_FAMILY: trucking-tms-backend

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Fail before spending time on a build if the targets are wrong.
      - name: Verify deploy targets exist
        run: |
          set -euo pipefail

          echo "Checking cluster '$ECS_CLUSTER'..."
          STATUS=$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' --output text)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::error::Cluster '$ECS_CLUSTER' is not ACTIVE (got '$STATUS')."
            exit 1
          fi

          echo "Checking service '$ECS_SERVICE'..."
          FOUND=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'length(services[?status==`ACTIVE`])' --output text)
          if [ "$FOUND" != "1" ]; then
            echo "::error::Service '$ECS_SERVICE' not found in '$ECS_CLUSTER'."
            echo "Services actually in this cluster:"
            aws ecs list-services --cluster "$ECS_CLUSTER" --output text
            exit 1
          fi

          echo "Targets OK."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" ./backend
          docker tag "$IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Takes the task definition that is live right now and changes only the
      # image. Everything else - env vars, secrets, roles, logging - is
      # preserved exactly, so configuration set by hand in the console (such
      # as the ANTHROPIC_SECRET_JSON secret reference) survives every deploy
      # and never has to live in this repository.
      - name: Register new task definition revision
        id: task-def
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > current-task-def.json

          CONTAINERS=$(jq '.containerDefinitions | length' current-task-def.json)
          if [ "$CONTAINERS" != "1" ]; then
            echo "::error::Expected 1 container in '$TASK_FAMILY', found $CONTAINERS."
            echo "This workflow assumes a single-container task. Update it before deploying."
            exit 1
          fi

          # register-task-definition rejects the read-only fields that
          # describe-task-definition returns, so strip them.
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' current-task-def.json > new-task-def.json

          echo "Secrets carried over: $(jq -r '[.containerDefinitions[0].secrets // [] | .[].name] | join(", ") // "(none)"' new-task-def.json)"

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --query 'service.deployments[0].{status:status,desired:desiredCount}' \
            --output table

      # The container runs the entrypoint migration scripts on boot, so a
      # successful stabilisation also means the schema changes applied.
      - name: Wait for the service to stabilise
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deployment summary
        if: always()
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          TASK_DEF_ARN: ${{ steps.task-def.outputs.arn }}
        run: |
          {
            echo "## API deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${IMAGE:-not built}\` |"
            echo "| Task definition | \`${TASK_DEF_ARN:-not registered}\` |"
            echo "| Cluster | \`$ECS_CLUSTER\` |"
            echo "| Service | \`$ECS_SERVICE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show recent logs on failure
        if: failure()
        run: |
          echo "Last 100 log lines from the service:"
          aws logs tail "/ecs/$TASK_FAMILY" --since 10m --format short | tail -100 || true
